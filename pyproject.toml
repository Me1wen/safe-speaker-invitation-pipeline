[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-speaker-invitation-pipeline"
version = "1.0.0"
description = "A review-first workflow for official-source speaker discovery and safe invitation delivery"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Speaker Pipeline Contributors" }]
keywords = ["speaker-discovery", "outreach", "email-drafts", "human-review", "smtp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Other Audience",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Office/Business",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "openpyxl>=3.1,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "PyYAML>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["speaker_pipeline*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["speaker_pipeline"]

[tool.coverage.report]
fail_under = 70
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "outputs", "work"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
