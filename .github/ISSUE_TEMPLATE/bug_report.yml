name: Bug report
description: Report reproducible incorrect behavior using fictional data only
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real recipients, customer data, or private contact information. Report security issues privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Academic collection
        - Industry collection
        - Candidate validation
        - Legacy migration
        - Draft generation
        - Dry run or SMTP delivery
        - CSV or Excel review
        - Documentation or setup
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use fictional example.com/example.org/example.edu data only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, command, and relevant non-secret configuration
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all credentials, private data, real recipient addresses, and unredacted delivery logs.
          required: true
